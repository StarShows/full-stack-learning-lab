name: full-stack-learning-lab
services:
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      BIND_ADDRESS: 0.0.0.0
      PORT: 13000
      DATABASE_PATH: /data/lab.sqlite
      OLLAMA_URL: http://ollama:11434
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-13000}:13000"
    volumes:
      - lab-data:/data
      - ./secrets:/run/secrets:ro
    networks: [edge, inference]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 25s

  model-pull:
    image: "ollama/ollama:${OLLAMA_IMAGE_VERSION:-0.40.8}"
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/pull-model.sh"]
    environment:
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5-coder:3b}"
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - model-data:/models
      - ./scripts/pull-model.sh:/opt/pull-model.sh:ro
    networks: [edge]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 256

  ollama:
    image: "ollama/ollama:${OLLAMA_IMAGE_VERSION:-0.40.8}"
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      model-pull:
        condition: service_completed_successfully
    environment:
      HOME: /tmp
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - model-data:/models:ro
    networks: [inference]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 6g
    cpus: 4
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  edge: {}
  inference:
    internal: true
volumes:
  lab-data: {}
  model-data: {}
